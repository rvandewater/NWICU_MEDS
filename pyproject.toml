[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NWICU-MEDS"
version = "0.0.13"
authors = [
  { name="Robin van de Water", email="robin.vandewater@hpi.de"},
  { name="Matthew McDermott", email="mattmcdermott8@gmail.com" },
]
description = "An ETL pipeline to extract NWICU data into the MEDS format."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Pure-config ETL: the only runtime dependency is MEDS-Extract itself, which supplies both
# CLIs (`meds-extract-download`, `meds-extract-run`) and every extraction stage.
#
# INTERIM (0.7 migration): MEDS-Extract 0.7.0 is not released yet, so `meds-extract`
# resolves from the upstream `dev` branch via [tool.uv.sources] below. Git builds of that
# branch self-identify as `0.6.3.devN`, so the specifier must admit dev pre-releases;
# switch back to `MEDS-extract[download]>=0.7.0,<0.8` and drop the git source once 0.7.0
# is on PyPI.
dependencies = ["MEDS-extract[download]>=0.6.2.dev0,<0.8"]

[tool.uv.sources]
meds-extract = { git = "https://github.com/mmcdermott/MEDS_extract", branch = "dev" }

[project.optional-dependencies]
dev = ["pre-commit<4"]
local_parallelism = ["hydra-joblib-launcher"]
slurm_parallelism = ["hydra-submitit-launcher"]

docs = [
  "mkdocs==1.6.0", "mkdocs-material==9.5.31", "mkdocstrings[python,shell]==0.25.2", "mkdocs-gen-files==0.5.0",
  "mkdocs-literate-nav==0.6.1", "mkdocs-section-index==0.3.9", "mkdocs-git-authors-plugin==0.9.0",
  "mkdocs-git-revision-date-localized-plugin==1.2.6"
]

# Registers the bundled MESSY file as a MEDS-Extract dataset pipeline, so the whole
# ETL is runnable as `meds-extract-run spec=NWICU output_dir=...`.
[project.entry-points."MEDS_extract.pipelines"]
NWICU = "NWICU_MEDS.configs:messy.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/NWICU_MEDS"
Issues = "https://github.com/rvandewater/NWICU_MEDS/issues"

[tool.pytest.ini_options]
# `--doctest-modules` is scoped to the modules CI passes on the command line. The doctests in
# `utils.py` / `unpack.py` are the API-level tests for those helpers.
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
