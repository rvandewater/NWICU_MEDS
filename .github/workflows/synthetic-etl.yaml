name: Synthetic ETL for MESSY files using MESSY_synth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra tests

      # The config and suMEDS-rules tests, and the offline `meds-extract-run spec=NWICU` runs, with
      # and without the suMEDS enrichment stage, over the synthetic release of tests/conftest.py.
      - name: Run the test suite
        run: uv run --locked pytest tests/

      - name: Generate and extract synthetic data
        # MESSY_synth reads MEDS-Extract 0.7 configs and requires MEDS-extract<0.8 (and Python >= 3.12),
        # so it runs in a tool environment of its own, on a 0.7 copy of the config: 0.7's
        # `_table.join` key, and without the `etl:` keys new in 0.8.1 (the extension stages and the
        # dataset.json descriptors), which its MEDS-Extract rejects and which don't affect which raw
        # columns the config reads. The ETL then runs the shipped config, suMEDS enrichment stage
        # included, with this project's locked MEDS-Extract. Drop the copy once MESSY_synth reads
        # 0.8.1 configs.
        run: |
          sed 's/^    joins:$/    join:/' src/NWICU_MEDS/messy.yaml |
            awk '/^etl:/ { etl = 1; print; next } etl && /^[^ ]/ { etl = 0 } /^$/ { drop = 0 }
              etl && /^  [a-z_]+:/ { drop = $1 ~ /^(pre_stages|post_stages|license|location_uri|description_uri|raw_source_id_columns|code_modifier_columns|additional_value_modality_columns|site_id_columns):$/ }
              !(etl && drop)' >messy_0.7.yaml
          uvx --python 3.12 --from git+https://github.com/rvandewater/MESSY_synth.git \
            MESSY_synth ./messy_0.7.yaml -o raw_synthetic/ --explain
          uv run --locked meds-extract-run spec=NWICU output_dir=./nwicu_meds_synth input_dir=raw_synthetic do_download=False
          # The stage ran and recorded the enrichment (or, without the packs, a soft failure).
          jq -e '.sumeds_enrichment.rules == "NWICU"' nwicu_meds_synth/metadata/dataset.json

      - name: Check the code metadata of the synthetic build
        run: NWICU_MEDS_OUTPUT_DIR=./nwicu_meds_synth uv run --locked pytest tests/test_code_metadata.py
