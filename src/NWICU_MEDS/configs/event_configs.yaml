nw_hosp/labevents:
  lab:
    code:
      - LAB
      - col(itemid)
      - col(valueuom)
    hadm_id: hadm_id
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum
    text_value: value
    priority: priority
    # Descriptions are attached in __main__ from NWICU's own d_labitems (joined on itemid). The
    # MIMIC-IV d_labitems_to_loinc crosswalk was removed: it is keyed on MIMIC lab itemids (50xxx)
    # that never match NWICU's (100xxx), so it produced 0 rows. LOINC/OMOP parent_codes would need
    # a NWICU-itemid -> LOINC bridge (TODO).

