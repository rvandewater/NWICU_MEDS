nw_icu/icustays:
  icu_admission:
    code:
      - ICU_ADMISSION
      - col(first_careunit)
    time: col(intime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
    icustay_id: stay_id
  icu_discharge:
    code:
      - ICU_DISCHARGE
      - col(last_careunit)
    time: col(outtime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
    icustay_id: stay_id

nw_icu/chartevents:
  event:
    code:
      - LAB
      - col(itemid)
      - col(valueuom)
    time: col(charttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    numeric_value: valuenum
    text_value: value
    hadm_id: hadm_id
    icustay_id: stay_id
    # Descriptions are attached in __main__ from NWICU's own d_items (joined on itemid). The
    # MIMIC-IV d_labitems_to_loinc crosswalk was removed (keyed on MIMIC lab itemids, which never
    # match NWICU chartevent itemids 3xxxxx -> 0 rows).

nw_icu/procedureevents:
  start:
    code:
      - PROCEDURE
      - START
      - col(itemid)
    time: col(starttime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
    icustay_id: stay_id
    # Descriptions are attached in __main__ from NWICU's own d_items (joined on itemid). The MIMIC-IV
    # proc_itemid / proc_datetimeevents crosswalks were removed (keyed on MIMIC itemids 22xxxx, which
    # never match NWICU procedure itemids 7xxxxx -> 0 rows).
  end:
    code:
      - PROCEDURE
      - END
      - col(itemid)
    time: col(endtime)
    time_format: "%Y-%m-%d %H:%M:%S"
    hadm_id: hadm_id
    icustay_id: stay_id
